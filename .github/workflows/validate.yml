name: Validate app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check src/worker.js\n          node --check public/modules.js
      - name: Run Worker API tests
        run: node --test tests/*.test.mjs
      - name: Check web and Android WebView JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = ["public/index.html", "app/src/main/assets/index.html"]
          for file_index, filename in enumerate(files):
              html = Path(filename).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.S | re.I)
              if not scripts:
                  if filename.endswith("app/src/main/assets/index.html"):
                      raise SystemExit(f"No inline application script found in {filename}")
                  continue
              for script_index, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  target = Path(f"/tmp/app-{file_index}-{script_index}.js")
                  target.write_text(script, encoding="utf-8")
                  print(target)
          PY
          for script in /tmp/app-*.js; do node --check "$script"; done
