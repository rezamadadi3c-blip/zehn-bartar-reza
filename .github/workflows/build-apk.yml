name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          html = pathlib.Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No embedded JavaScript blocks found")
          for index, script in enumerate(scripts, 1):
              path = pathlib.Path(tempfile.gettempdir()) / f"zb-script-{index}.js"
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Validated {len(scripts)} embedded JavaScript blocks")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zehn-bartar-reza-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
